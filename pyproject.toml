[project]
name = "rigseal"
version = "0.0.1"
description = "A lockfile for your AI agent setup: skills, plugins, hooks and MCP servers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
rigseal = "rigseal.cli:app"

[dependency-groups]
dev = ["pytest>=8"]
eval = [
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
