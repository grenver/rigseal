[project]
name = "rigseal"
version = "0.1.0"
description = "A lockfile for your AI agent setup: skills, plugins, hooks and MCP servers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Jay Hemnani" }]
keywords = ["ai-agents", "claude-code", "cursor", "mcp", "lockfile", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/jayhemnani9910/rigseal"
Issues = "https://github.com/jayhemnani9910/rigseal/issues"
Changelog = "https://github.com/jayhemnani9910/rigseal/blob/main/CHANGELOG.md"

[project.scripts]
rigseal = "rigseal.cli:app"

[dependency-groups]
dev = ["pytest>=8"]
eval = [
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
